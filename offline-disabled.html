<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1478ff" />
    <title>Offline Access Disabled</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #11233c;
        background: linear-gradient(145deg, #edf3fb, #dbe8f8);
      }
      main {
        width: min(560px, 100%);
        padding: 24px;
        border-radius: 16px;
        border: 1px solid rgba(17, 35, 60, 0.15);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 40px rgba(17, 35, 60, 0.15);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.45;
      }
      a {
        color: #0b57d0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline Access Is Disabled</h1>
      <p>
        Your subscription needs online verification before offline mode can be
        used again.
      </p>
      <p>Please reconnect to the internet and log in to continue.</p>
      <p><a href="./intro/intro.html">Go to login</a></p>
    </main>
  </body>
</html>
